[project]
name = "alchemy-helper"
dynamic = ["version"]
description = "Skyrim SE alchemy effect finder and discovery planner (local web app)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "lz4>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alchemy_helper*"]

[tool.setuptools.dynamic]
version = { attr = "alchemy_helper.__version__" }

[tool.pytest.ini_options]
markers = [
  "combinatorics: tests for the combinatorics module (select with: pytest -m combinatorics)",
]
